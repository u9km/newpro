name: Build iOS dylib with Dobby

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Environment and Dobby
        run: |
          mkdir -p build
          
          # 1. تحميل Dobby
          curl -L -o dobby.zip https://github.com/jmpews/Dobby/archive/refs/heads/master.zip
          unzip -q dobby.zip
          
          # 2. البحث عن مجلد src الفعلي داخل المستخرج
          # عادة يكون Dobby-master/src
          if [ -d "Dobby-master/src" ]; then
            echo "Dobby src folder found."
          else
            echo "Error: Dobby src folder not found."
            exit 1
          fi

      - name: Compile dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # 3. تجميع ملفات dobby مع ملف الكود الخاص بك (ShadowEngine.mm)
          # ملاحظة: تأكد أن ملف ShadowEngine.mm موجود في المجلد الرئيسي للمستودع
          
          clang++ -arch arm64 -dynamiclib \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=12.0 \
            -fobjc-arc \
            -I. -IDobby-master/include \
            Dobby-master/src/dobby.c \
            Dobby-master/src/dobby_helper.c \
            Dobby-master/src/UserInterface/dobby_ui.c \
            Dobby-master/src/InstructionRelocator/arm64/arm64_instruction_relocator.c \
            Dobby-master/src/InstructionRelocator/arm64/arm64_relocator.c \
            -framework Foundation -framework UIKit -framework Security \
            ShadowEngine.mm -o build/ShadowBreaker.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowBreaker_dylib
          path: build/ShadowBreaker.dylib
