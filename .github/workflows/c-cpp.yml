name: Build iOS dylib with Dobby

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          mkdir -p build
          # تحميل مكتبة Dobby (الإصدار الأخير)
          curl -L -o dobby.zip https://github.com/jmpews/Dobby/archive/refs/heads/master.zip
          unzip dobby.zip
          mv Dobby-master/include/dobby.h .
          # نحتاج إلى dobby.a، سنقوم ببنائه أو تحميله. للبساطة في Actions، سنبني الكود مباشرة مع ملفات dobby.c
          cp -r Dobby-master/src dobby_src
          rm -rf Dobby-master dobby.zip

      - name: Compile dylib
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # تجميع ملفات dobby مع ملف الكود الخاص بك (افترضت أن اسم ملفك هو ShadowEngine.mm)
          # إذا كان اسم ملفك مختلفاً، قم بتغيير ShadowEngine.mm أدناه
          
          clang++ -arch arm64 -dynamiclib \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=12.0 \
            -fobjc-arc \
            -I. -Idobby_src \
            dobby_src/dobby.c \
            dobby_src/dobby_helper.c \
            dobby_src/UserInterface/dobby_ui.c \
            dobby_src/InstructionRelocator/arm64/arm64_instruction_relocator.c \
            dobby_src/InstructionRelocator/arm64/arm64_relocator.c \
            dobby_src/InstructionRelocator/arm64/arm64_instruction_relocator.c \
            dobby_src/InstructionRelocator/arm64/arm64_relocator.c \
            dobby_src/InstructionRelocator/arm64/arm64_instruction_relocator.c \
            dobby_src/InstructionRelocator/arm64/arm64_relocator.c \
            -framework Foundation -framework UIKit -framework Security \
            ShadowEngine.mm -o build/ShadowBreaker.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowBreaker_dylib
          path: build/ShadowBreaker.dylib
