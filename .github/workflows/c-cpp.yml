name: Build SovereignSecurity v5

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Setup Theos
        run: |
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/theos/bin" >> $GITHUB_PATH

      - name: Setup iOS SDK
        run: |
          git clone https://github.com/theos/sdks.git $THEOS/sdks

      - name: Check for libdobby.a
        run: |
          if [ -f "libdobby.a" ]; then
            echo "libdobby.a found."
          else
            echo "::error::libdobby.a not found! Please add it to the root directory."
            exit 1
          fi

      - name: Build Package
        run: |
          make package FINALPACKAGE=1
        env:
          THEOS: /opt/theos

      - name: Upload Artifact
        # تم تحديثه إلى النسخة v4 بناءً على الخطأ
        uses: actions/upload-artifact@v4
        with:
          name: SovereignSecurity_DEB
          path: packages/*.deb
