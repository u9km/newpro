name: build_sovereign_security_final_non_jb

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # نستخدم بيئة Linux لأنها أسرع وأسهل لتشغيل Docker
    runs-on: ubuntu-latest
    
    # استخدام صورة Docker تحتوي على Theos و iOS SDK جاهزة
    container:
      image: theos/theos:latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Verify Project Files
        run: |
          if [ -f "libdobby.a" ]; then
            echo "libdobby.a found."
          else
            echo "::error::libdobby.a not found in root directory! Please add it."
            exit 1
          fi

      - name: Build SovereignSecurity
        run: |
          # تنظيف أي بقايا بنائية
          make clean
          # تنفيذ البناء مع إظهار تفاصيل الربط
          make package FINALPACKAGE=1
        env:
          THEOS: /opt/theos

      - name: Upload Sovereign Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SovereignSecurity-NonJB-Package
          path: |
            packages/*.deb
            .theos/obj/debug/*.dylib
            .theos/obj/*.dylib
