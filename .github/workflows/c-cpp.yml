name: build_sovereign_security_final

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        run: |
          # تثبيت Theos في مسار توافقي مع نظام macOS
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          
      - name: Install Dependencies
        run: |
          brew install ldid
          # تثبيت SDKs الضرورية للبناء
          sudo git clone https://github.com/theos/sdks.git /opt/theos/sdks
        
      - name: Check for libdobby.a
        run: |
          # التحقق من وجود المكتبة المطلوبة في الـ Makefile الخاص بك
          if [ -f "libdobby.a" ]; then
            echo "libdobby.a found."
          else
            echo "::error::libdobby.a not found! Please add it to the root directory."
            exit 1
          fi

      - name: Build SovereignSecurity
        run: |
          # تصدير متغير البيئة Theos ليعرف Makefile مكانه
          export THEOS=/opt/theos
          # تنفيذ البناء
          /opt/theos/bin/make package FINALPACKAGE=1
        env:
          THEOS: /opt/theos

      - name: Upload Sovereign Artifacts
        uses: actions/upload-artifact@v4
        with:
          # اسم المجلد المضغوط الناتج
          name: SovereignSecurity-Full-Package
          path: |
            packages/*.deb
            .theos/obj/debug/*.dylib
            .theos/obj/*.dylib
