name: build_sovereign_security_final_gui

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          sudo rm -rf /opt/theos
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/theos/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          brew install ldid
          sudo rm -rf /opt/theos/sdks
          sudo git clone https://github.com/theos/sdks.git /opt/theos/sdks

      - name: Verify Project Files
        run: |
          if [ -f "libdobby.a" ]; then
            echo "libdobby.a found."
          else
            echo "::error::libdobby.a not found in root directory! Please add it."
            exit 1
          fi

      - name: Build SovereignSecurity
        run: |
          export THEOS=/opt/theos
          make clean
          # تنفيذ البناء مع UIKit
          make package FINALPACKAGE=1
        env:
          THEOS: /opt/theos

      - name: Upload Sovereign Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SovereignSecurity-GUI-Package
          path: |
            packages/*.deb
            .theos/obj/debug/*.dylib
            .theos/obj/*.dylib
