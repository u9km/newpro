name: Build iOS dylib with Local Dobby

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile dylib
        run: |
          mkdir -p build
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # تأكد من أن الملفات موجودة في المستودع:
          # - ShadowEngine.mm (كودك)
          # - dobby.h
          # - libdobby.a
          
          clang++ -arch arm64 -dynamiclib \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=12.0 \
            -fobjc-arc \
            -I. \
            libdobby.a \
            -framework Foundation -framework UIKit -framework Security \
            ShadowEngine.mm -o build/ShadowBreaker.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShadowBreaker_dylib
          path: build/ShadowBreaker.dylib
