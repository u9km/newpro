name: build_sovereign_security_final_non_jb

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest # نستخدم macOS لأنه أسهل لتثبيت أدوات Apple

    steps:
      - uses: actions/checkout@v4

      - name: Install Theos & Dependencies
        run: |
          # تثبيت أدوات Apple الضرورية
          brew install ldid
          
          # تثبيت Theos يدوياً
          git clone --recursive https://github.com/theos/theos.git ~/theos
          
      - name: Setup iOS SDK
        run: |
          # تحميل الـ SDKs الضرورية للبناء (بديل عن الصورة الخارجية)
          git clone https://github.com/theos/sdks.git ~/theos/sdks
        
      - name: Verify Project Files
        run: |
          # التأكد من وجود ملف libdobby.a
          if [ -f "libdobby.a" ]; then
            echo "libdobby.a found."
          else
            echo "::error::libdobby.a not found in root directory!"
            exit 1
          fi

      - name: Build SovereignSecurity
        run: |
          export THEOS=~/theos
          # تنظيف وبناء المشروع
          make clean
          make package FINALPACKAGE=1
        env:
          THEOS: ~/theos

      - name: Upload Sovereign Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SovereignSecurity-NonJB-Package
          path: |
            packages/*.deb
            .theos/obj/debug/*.dylib
            .theos/obj/*.dylib
