name: build_sovereign_security_final_v6

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        run: |
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "/opt/theos/bin" >> $GITHUB_PATH
      
      - name: Install Dependencies
        run: |
          brew install ldid
          sudo git clone https://github.com/theos/sdks.git /opt/theos/sdks
        
      - name: Verify Project Files
        run: |
          # التأكد من وجود ملفات المصدر الضرورية
          if [ ! -f "SovereignSecurity.m" ] || [ ! -f "fishhook.c" ]; then
            echo "::error::Source files (.m or .c) missing!"
            exit 1
          fi
          # التأكد من وجود مكتبة Dobby
          if [ -f "libdobby.a" ]; then
            echo "libdobby.a found."
          else
            echo "::error::libdobby.a not found in root directory! Please add it."
            exit 1
          fi

      - name: Build SovereignSecurity
        run: |
          export THEOS=/opt/theos
          # تنظيف أي بقايا بنائية قديمة
          make clean
          # تنفيذ البناء مع إظهار تفاصيل الربط
          make package FINALPACKAGE=1
        env:
          THEOS: /opt/theos

      - name: Upload Sovereign Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SovereignSecurity-Full-Package
          path: |
            packages/*.deb
            .theos/obj/debug/*.dylib
            .theos/obj/*.dylib
